<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162c"/>
      <stop offset="50%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5d0"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#00e5d0" stroke-width="4" stroke-opacity="0.45"/>

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#00e5d0" stroke-width="2.5" stroke-dasharray="14 10" stroke-opacity="0.5"/>
  <circle cx="256" cy="230" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Ocean Wave Silhouette in Circle -->
  <path d="M106 280 C 150 250, 190 300, 256 270 C 320 240, 360 290, 406 270 L 406 390 L 106 390 Z" fill="#041220" opacity="0.8"/>
  <path d="M106 300 C 160 275, 200 315, 256 290 C 310 265, 360 305, 406 285" fill="none" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)"/>
  <path d="M106 325 C 160 305, 200 340, 256 318 C 310 295, 360 330, 406 312" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Bagan Tancap Structure Pillars & Cabin -->
  <!-- Stilt legs -->
  <line x1="180" y1="360" x2="220" y2="160" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="332" y1="360" x2="292" y2="160" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="260" x2="352" y2="260" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="310" x2="332" y2="310" stroke="#fef08a" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Cross Bracing -->
  <line x1="200" y1="260" x2="312" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="312" y1="260" x2="200" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Cabin Platform -->
  <polygon points="190,165 322,165 302,120 210,120" fill="#0c2340" stroke="#00e5d0" stroke-width="3"/>
  <polygon points="200,120 312,120 256,80" fill="url(#cyanGrad)" opacity="0.9"/>

  <!-- Winch Pulley & Sensor Glow Core -->
  <circle cx="256" cy="180" r="22" fill="#07162c" stroke="#00e5d0" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="180" r="10" fill="#00e5d0"/>

  <!-- Hanging Main Cable & Net Outline -->
  <line x1="256" y1="202" x2="256" y2="250" stroke="#00e5d0" stroke-width="3" filter="url(#glow)"/>
  <!-- Load cell inline diamond -->
  <polygon points="256,220 263,227 256,234 249,227" fill="#fef08a" stroke="#07162c" stroke-width="1.5"/>

  <!-- Net Spreader & Mesh -->
  <line x1="210" y1="260" x2="302" y2="260" stroke="#00e5d0" stroke-width="3"/>
  <path d="M210 260 Q 256 310 302 260" fill="none" stroke="#00e5d0" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="256" cy="285" r="4" fill="#fef08a" filter="url(#glow)"/>

  <!-- Brand Typography -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">BAGANOVA</text>
  <text x="256" y="472" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00e5d0" text-anchor="middle" letter-spacing="3">SMART AUTOMATED BAGAN</text>
</svg>
